<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Vault Door Body -->
  <rect x="20" y="20" width="160" height="160" rx="8" fill="#3B4252" stroke="#2E3440" stroke-width="3"/>
  <!-- Inner Door Panel -->
  <rect x="30" y="30" width="140" height="140" rx="4" fill="#434C5E" stroke="#2E3440" stroke-width="2"/>
  <!-- Corner Bolts -->
  <circle cx="40" cy="40" r="6" fill="#2E3440"/>
  <circle cx="160" cy="40" r="6" fill="#2E3440"/>
  <circle cx="40" cy="160" r="6" fill="#2E3440"/>
  <circle cx="160" cy="160" r="6" fill="#2E3440"/>
  <!-- Central Dial - Outer Circle -->
  <circle cx="100" cy="100" r="40" fill="#4C566A" stroke="#2E3440" stroke-width="3"/>
  <!-- Dial Markings -->
  <circle cx="100" cy="100" r="35" fill="none" stroke="#2E3440" stroke-width="1" stroke-dasharray="3 5"/>
  <!-- Inner Dial -->
  <circle cx="100" cy="100" r="28" fill="#5E81AC" stroke="#2E3440" stroke-width="2"/>
  <!-- Dial Indicator Line -->
  <line x1="100" y1="72" x2="100" y2="85" stroke="#ECEFF4" stroke-width="3" stroke-linecap="round"/>
  <!-- Center Knob -->
  <circle cx="100" cy="100" r="8" fill="#2E3440"/>
  <circle cx="100" cy="100" r="5" fill="#434C5E"/>
  <!-- Handle -->
  <rect x="145" y="95" width="25" height="10" rx="5" fill="#4C566A" stroke="#2E3440" stroke-width="2"/>
  <circle cx="145" cy="100" r="5" fill="#2E3440"/>
  <!-- Hinge Indicators (left side) -->
  <rect x="25" y="70" width="8" height="15" rx="2" fill="#2E3440"/>
  <rect x="25" y="115" width="8" height="15" rx="2" fill="#2E3440"/>
</svg>