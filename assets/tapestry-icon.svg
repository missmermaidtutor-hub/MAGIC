<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hanging Rod -->
  <line x1="30" y1="25" x2="170" y2="25" stroke="#8B4513" stroke-width="4" stroke-linecap="round"/>
  <!-- Rod End Caps -->
  <circle cx="30" cy="25" r="5" fill="#654321"/>
  <circle cx="170" cy="25" r="5" fill="#654321"/>
  <!-- Main Tapestry Body -->
  <rect x="40" y="30" width="120" height="150" rx="4" fill="#8B1538"/>
  <!-- Border Design -->
  <rect x="40" y="30" width="120" height="150" rx="4" fill="none" stroke="#D4AF37" stroke-width="3"/>
  <!-- Inner Border -->
  <rect x="48" y="38" width="104" height="134" rx="2" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <!-- Decorative Pattern - Top -->
  <path d="M 60 50 Q 70 45 80 50 Q 90 55 100 50 Q 110 45 120 50 Q 130 55 140 50" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <!-- Central 5-Point Star -->
  <g transform="translate(100, 115)">
    <!-- Top point (maroon) - extends from center to top tip -->
    <path d="M 0,0 L -10.5,-10.5 L 0,-35 L 10.5,-10.5 Z" fill="#8B1538" stroke="#D4AF37" stroke-width="1"/>
    
    <!-- Right-top point (orange) - extends from center to right-top tip -->
    <path d="M 0,0 L 10.5,-10.5 L 37,-10.5 L 15.5,6 Z" fill="#E07020" stroke="#D4AF37" stroke-width="1"/>
    
    <!-- Right-bottom point (yellow) - extends from center to right-bottom tip -->
    <path d="M 0,0 L 15.5,6 L 24,32 L 0,15 Z" fill="#DAA520" stroke="#D4AF37" stroke-width="1"/>
    
    <!-- Left-bottom point (green) - extends from center to left-bottom tip -->
    <path d="M 0,0 L 0,15 L -24,32 L -15.5,6 Z" fill="#228B22" stroke="#D4AF37" stroke-width="1"/>
    
    <!-- Left-top point (purple) - extends from center to left-top tip -->
    <path d="M 0,0 L -15.5,6 L -37,-10.5 L -10.5,-10.5 Z" fill="#4B0082" stroke="#D4AF37" stroke-width="1"/>
    
    <!-- Outer star outline -->
    <path 
      d="M 0,-35 L 10.5,-10.5 L 37,-10.5 L 15.5,6 L 24,32 L 0,15 L -24,32 L -15.5,6 L -37,-10.5 L -10.5,-10.5 Z" 
      fill="none" 
      stroke="#D4AF37" 
      stroke-width="2"
    />
  </g>
  <!-- Side Decorative Elements -->
  <path d="M 55 80 Q 60 85 55 90" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <path d="M 145 80 Q 140 85 145 90" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <path d="M 55 120 Q 60 125 55 130" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <path d="M 145 120 Q 140 125 145 130" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <!-- Bottom Decorative Pattern -->
  <path d="M 60 160 Q 70 165 80 160 Q 90 155 100 160 Q 110 165 120 160 Q 130 155 140 160" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <!-- Hanging Strings -->
  <line x1="50" y1="30" x2="50" y2="25" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="80" y1="30" x2="80" y2="25" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="100" y1="30" x2="100" y2="25" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="120" y1="30" x2="120" y2="25" stroke="#8B4513" stroke-width="1.5"/>
  <line x1="150" y1="30" x2="150" y2="25" stroke="#8B4513" stroke-width="1.5"/>
  <!-- Bottom Tassels -->
  <line x1="50" y1="180" x2="50" y2="190" stroke="#8B1538" stroke-width="2"/>
  <line x1="80" y1="180" x2="80" y2="190" stroke="#8B1538" stroke-width="2"/>
  <line x1="100" y1="180" x2="100" y2="195" stroke="#8B1538" stroke-width="2"/>
  <line x1="120" y1="180" x2="120" y2="190" stroke="#8B1538" stroke-width="2"/>
  <line x1="150" y1="180" x2="150" y2="190" stroke="#8B1538" stroke-width="2"/>
  <!-- Tassel Ends -->
  <circle cx="50" cy="190" r="2.5" fill="#D4AF37"/>
  <circle cx="80" cy="190" r="2.5" fill="#D4AF37"/>
  <circle cx="100" cy="195" r="2.5" fill="#D4AF37"/>
  <circle cx="120" cy="190" r="2.5" fill="#D4AF37"/>
  <circle cx="150" cy="190" r="2.5" fill="#D4AF37"/>
</svg>